name: Construir APK ShanRyu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Descomprimir proyecto ShanRyu
        run: |
          mkdir -p proyecto
          unzip -q ShanRyu_V13_APK*.zip -d proyecto

      - name: Compilar APK
        run: |
          PROJECT_DIR=$(find proyecto -name settings.gradle -printf '%h\n' | head -1)
          echo "Proyecto encontrado en: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ShanRyu-APK
          path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
