name: Construir APK ShanRyu B16.4 B32 V4

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  compilar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto V4
        uses: actions/checkout@v4

      - name: Verificar que es el proyecto V4
        run: |
          test -f app/src/main/assets/index.html
          grep -q "INGRESAR COMO PROFESOR" app/src/main/assets/index.html
          grep -q "INGRESAR COMO ADMINISTRADOR" app/src/main/assets/index.html
          echo "Proyecto V4 verificado."

      - name: Corregir calendario de nacimiento V4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/index.html")
          s = p.read_text(encoding="utf-8")

          old_reg = '<input id="reg_nacimiento" class="input" type="date" inputmode="none" onclick="if(this.showPicker){try{this.showPicker()}catch(e){}}" onfocus="if(this.showPicker){try{this.showPicker()}catch(e){}}" onchange="updateRegistrationMinorFields()">'
          new_reg = '<input id="reg_nacimiento" class="input" type="text" readonly placeholder="dd/mm/aaaa" autocomplete="bday" onclick="openBirthCalendar(\'reg_nacimiento\')" onfocus="openBirthCalendar(\'reg_nacimiento\')" onchange="updateRegistrationMinorFields()">'
          if old_reg not in s:
              raise SystemExit("No se encontró el campo de nacimiento del registro de alumno.")
          s = s.replace(old_reg, new_reg, 1)

          old_prof = '<input id="prof_nacimiento" class="input" type="date" inputmode="none">'
          new_prof = '<input id="prof_nacimiento" class="input" type="text" readonly placeholder="dd/mm/aaaa" autocomplete="bday" onclick="openBirthCalendar(\'prof_nacimiento\')" onfocus="openBirthCalendar(\'prof_nacimiento\')">'
          if old_prof not in s:
              raise SystemExit("No se encontró el campo de nacimiento del profesor.")
          s = s.replace(old_prof, new_prof, 1)

          old_f = '   <div class="field"><label>Fecha de nacimiento</label><input id="f_birth" class="input" type="date" inputmode="none" value="${esc(birth)}" onclick="if(this.showPicker){try{this.showPicker()}catch(e){}}" onfocus="if(this.showPicker){try{this.showPicker()}catch(e){}}" onchange="updateStudentMinorFields()"></div>'
          new_f = '   <div class="field"><label>Fecha de nacimiento</label><input id="f_birth" class="input" type="text" readonly placeholder="dd/mm/aaaa" value="${esc(formatBirthDate(birth))}" data-iso="${esc(birth)}" onclick="openBirthCalendar(\'f_birth\')" onfocus="openBirthCalendar(\'f_birth\')" onchange="updateStudentMinorFields()"></div>'
          if old_f not in s:
              raise SystemExit("No se encontró el campo de nacimiento del administrador.")
          s = s.replace(old_f, new_f, 1)

          helper = r'''/* SELECTOR DE FECHA DE NACIMIENTO SHAN RYU: independiente del calendario nativo de Android */
          let shanBirthCalendarTarget='';
          let shanBirthCalendarValue='';
          function normalizeBirthDate(v){
           const x=String(v||'').trim();
           if(/^\d{4}-\d{2}-\d{2}$/.test(x))return x;
           const m=x.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
           return m?\`${m[3]}-${m[2]}-${m[1]}\`:'';
          }
          function formatBirthDate(v){
           const iso=normalizeBirthDate(v); if(!iso)return '';
           const [y,m,d]=iso.split('-'); return \`${d}/${m}/${y}\`;
          }
          function birthIso(id){return normalizeBirthDate($(id)?.dataset?.iso||$(id)?.value||'');}
          function setBirthInput(id,iso){
           const el=$(id); if(!el)return;
           el.dataset.iso=iso||''; el.value=formatBirthDate(iso);
           el.dispatchEvent(new Event('change',{bubbles:true}));
          }
          function openBirthCalendar(id){
           const input=$(id); if(!input)return;
           shanBirthCalendarTarget=id;
           shanBirthCalendarValue=birthIso(id);
           if(!shanBirthCalendarValue){
             const now=new Date();
             const y=Math.max(1900,now.getFullYear()-18);
             shanBirthCalendarValue=\`${y}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}\`;
           }
           renderBirthCalendar();
           const overlay=$('shanBirthCalendar'); if(overlay)overlay.classList.remove('hidden');
          }
          function closeBirthCalendar(){ $('shanBirthCalendar')?.classList.add('hidden'); shanBirthCalendarTarget=''; }
          function renderBirthCalendar(){
           const root=$('shanBirthCalendar'); if(!root)return;
           const [yy,mm,dd]=normalizeBirthDate(shanBirthCalendarValue).split('-').map(Number);
           const now=new Date(); const maxIso=\`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}\`;
           const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
           const first=new Date(yy,mm-1,1), days=new Date(yy,mm,0).getDate();
           let start=(first.getDay()+6)%7, html='';
           for(let i=0;i<start;i++)html+='<span class="sr-date-empty"></span>';
           for(let d=1;d<=days;d++){
             const iso=\`${yy}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}\`;
             const sel=iso===shanBirthCalendarValue?' selected':'';
             const disabled=iso>maxIso?' disabled':'';
             html+=\`<button type="button" class="sr-date-day${sel}"${disabled} onclick="chooseBirthDay('${iso}')">${d}</button>\`;
           }
           const years=[]; for(let y=now.getFullYear();y>=1900;y--)years.push(\`<option value="${y}" ${y===yy?'selected':''}>${y}</option>\`);
           root.innerHTML=\`<div class="sr-date-backdrop" onclick="closeBirthCalendar()"></div><div class="sr-date-card" role="dialog" aria-modal="true" aria-label="Seleccionar fecha de nacimiento">
            <div class="sr-date-title">Fecha de nacimiento</div>
            <div class="sr-date-head"><select id="srBirthMonth" class="select" onchange="changeBirthMonth(this.value)">${monthNames.map((n,i)=>\`<option value="${i+1}" ${i+1===mm?'selected':''}>${n}</option>\`).join('')}</select><select id="srBirthYear" class="select" onchange="changeBirthYear(this.value)">${years.join('')}</select></div>
            <div class="sr-date-week"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
            <div class="sr-date-grid">${html}</div>
            <div class="sr-date-actions"><button type="button" class="btn ghost" onclick="closeBirthCalendar()">Cancelar</button><button type="button" class="btn red" onclick="acceptBirthCalendar()">ACEPTAR</button></div>
           </div>\`;
          }
          function changeBirthMonth(m){
           const [y,,d]=normalizeBirthDate(shanBirthCalendarValue).split('-');
           const day=String(Math.min(Number(d),new Date(Number(y),Number(m),0).getDate())).padStart(2,'0');
           shanBirthCalendarValue=\`${y}-${String(m).padStart(2,'0')}-${day}\`; renderBirthCalendar();
          }
          function changeBirthYear(y){
           const [,m,d]=normalizeBirthDate(shanBirthCalendarValue).split('-');
           const day=String(Math.min(Number(d),new Date(Number(y),Number(m),0).getDate())).padStart(2,'0');
           shanBirthCalendarValue=\`${y}-${m}-${day}\`; renderBirthCalendar();
          }
          function chooseBirthDay(iso){shanBirthCalendarValue=iso; renderBirthCalendar();}
          function acceptBirthCalendar(){
           if(!shanBirthCalendarTarget||!shanBirthCalendarValue)return;
           setBirthInput(shanBirthCalendarTarget,shanBirthCalendarValue);
           if(shanBirthCalendarTarget==='reg_nacimiento')updateRegistrationMinorFields();
           if(shanBirthCalendarTarget==='f_birth')updateStudentMinorFields();
           closeBirthCalendar();
          }

          '''
          marker = 'function registrationAge(){'
          if marker not in s:
              raise SystemExit("No se encontró el punto de inserción del calendario.")
          s = s.replace(marker, helper + marker, 1)

          s = s.replace("const v=$('reg_nacimiento')?.value; if(!v)return null;", "const v=birthIso('reg_nacimiento'); if(!v)return null;", 1)
          s = s.replace("const nombre=$('prof_nombre').value.trim(),nacimiento=$('prof_nacimiento').value,telefono=", "const nombre=$('prof_nombre').value.trim(),nacimiento=birthIso('prof_nacimiento'),telefono=", 1)
          s = s.replace("calculateAge(document.getElementById('f_birth')?.value||'');", "calculateAge(birthIso('f_birth'));", 1)
          s = s.replace("const age=calculateAge($('f_birth').value||'');", "const age=calculateAge(birthIso('f_birth'));", 1)
          s = s.replace("fecha_nacimiento:$('f_birth').value||null", "fecha_nacimiento:birthIso('f_birth')||null", 1)

          css = r'''<style id="shanryu-birth-calendar">
          .sr-date-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:240}
          .sr-date-card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);max-height:88vh;overflow:auto;background:#111419;border:1px solid #343a43;border-radius:22px;padding:18px;z-index:241;box-shadow:0 18px 60px rgba(0,0,0,.55);box-sizing:border-box}
          .sr-date-title{font-size:21px;font-weight:900;color:#f4f4f4;margin-bottom:14px}
          .sr-date-head{display:grid;grid-template-columns:1fr 1fr;gap:10px}
          .sr-date-week,.sr-date-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
          .sr-date-week{margin:16px 0 7px;color:#9ca3af;font-size:12px;text-align:center;font-weight:800}
          .sr-date-day{min-height:42px;border:1px solid #303640;border-radius:10px;background:#1c2128;color:#f5f5f5;font-weight:800;font-size:15px}
          .sr-date-day.selected{background:#d71920;border-color:#d71920;color:#fff}
          .sr-date-day:disabled{opacity:.22}.sr-date-empty{min-height:42px}
          .sr-date-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.sr-date-actions .btn{min-height:48px}
          </style>
          <div id="shanBirthCalendar" class="hidden"></div>
          '''
          if 'id="shanryu-birth-calendar"' not in s:
              s = s.replace('</body>', css + '</body>', 1)

          p.write_text(s, encoding="utf-8")
          print("Calendario V4 aplicado.")
          PY

      - name: Verificar correcciones antes de compilar
        run: |
          grep -q "id="shanryu-birth-calendar"" app/src/main/assets/index.html
          grep -q "openBirthCalendar('prof_nacimiento')" app/src/main/assets/index.html
          grep -q "openBirthCalendar('reg_nacimiento')" app/src/main/assets/index.html
          grep -q "function acceptBirthCalendar" app/src/main/assets/index.html
          echo "Correcciones de calendario verificadas."

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK V4
        run: gradle :app:assembleDebug --no-daemon

      - name: Verificar APK generado
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -p "$APK" assets/index.html > /tmp/apk-index.html
          grep -q "INGRESAR COMO PROFESOR" /tmp/apk-index.html
          grep -q "INGRESAR COMO ADMINISTRADOR" /tmp/apk-index.html
          grep -q "function acceptBirthCalendar" /tmp/apk-index.html
          echo "APK verificado: V4 + calendario nuevo."

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ShanRyu-B16.4-B32-V4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
