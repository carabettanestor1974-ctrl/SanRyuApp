name: Construir APK ShanRyu B16.4 B32 V4

on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  compilar-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto V4
        uses: actions/checkout@v4
      - name: Verificar que es el proyecto V4
        run: |
          test -f app/src/main/assets/index.html
          grep -q "INGRESAR COMO PROFESOR" app/src/main/assets/index.html
          grep -q "INGRESAR COMO ADMINISTRADOR" app/src/main/assets/index.html
      - name: Verificar correcciones V4
        run: |
          grep -q "function openBirthCalendar" app/src/main/assets/index.html
          grep -q "function acceptBirthCalendar" app/src/main/assets/index.html
          grep -q 'id="f_photo"' app/src/main/assets/index.html
          grep -q 'id="prof_foto"' app/src/main/assets/index.html
      - name: Habilitar comunicados para profesores
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/assets/index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("function openAnnouncementModal(id=''){if(!isAdmin())return;",
                      "function openAnnouncementModal(id=''){if(!isAdmin()&&!isProfessor())return;")
          s=s.replace("async function saveAnnouncement(id){if(!isAdmin())return;",
                      "async function saveAnnouncement(id){if(!isAdmin()&&!isProfessor())return;")
          s=s.replace("function setupProfessorUI(){",
                      "function setupProfessorUI(){\n setProfessorAnnouncementButton();")
          s=s.replace("function setAdminActionButtons(show){",
                      "function setProfessorAnnouncementButton(){const el=$('newAnnouncementBtn');if(el)el.classList.remove('hidden');}\nfunction setAdminActionButtons(show){")
          bt=chr(96); dl=chr(36)
          old=dl+"{isAdmin()?"+bt+"<div class=\\"material-actions\\"><button class=\\"btn mini\\" onclick=\\"openAnnouncementModal('"+dl+"{a.id}')\\">Editar</button><button class=\\"btn danger mini\\" onclick=\\"confirmDeleteAnnouncement('"+dl+"{a.id}')\\">Eliminar</button></div>"+bt+":''}"
          new=dl+"{(isAdmin()||isProfessor())?"+bt+"<div class=\\"material-actions\\"><button class=\\"btn mini\\" onclick=\\"openAnnouncementModal('"+dl+"{a.id}')\\">Editar</button>"+dl+"{isAdmin()?"+bt+"<button class=\\"btn danger mini\\" onclick=\\"confirmDeleteAnnouncement('"+dl+"{a.id}')\\">Eliminar</button>"+bt+":''}</div>"+bt+":''}"
          s=s.replace(old,new)
          p.write_text(s,encoding="utf-8")
          PY
          grep -q "setProfessorAnnouncementButton" app/src/main/assets/index.html
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK V4
        run: gradle :app:assembleDebug --no-daemon
      - name: Verificar APK generado
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -p "$APK" assets/index.html > /tmp/apk-index.html
          grep -q "setProfessorAnnouncementButton" /tmp/apk-index.html
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ShanRyu-B16.4-B32-V4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
