
name: Construir APK ShanRyu

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  compilar-apk:
    runs-on: ubuntu-latest

    steps:
      
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -o ShanRyu_V13_APK_cloud_ready.zip

      - name: Preparar Java 17
        uses: actions/setup-java@v4
    
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        working-directory: shanryu_v13
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          path: shanryu_v13/app/build/outputs/apk/debug/*.apk
