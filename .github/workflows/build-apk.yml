name: Construir APK ShanRyu B16.4 B32 V4
# build final fix material syntax

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  compilar-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto V4
        uses: actions/checkout@v4

      - name: Verificar que es el proyecto V4
        run: |
          test -f app/src/main/assets/index.html
          grep -q "INGRESAR COMO PROFESOR" app/src/main/assets/index.html
          grep -q "INGRESAR COMO ADMINISTRADOR" app/src/main/assets/index.html

      - name: Aplicar correcciones puntuales V4
        run: python3 tools/final_v4_patch.py

      - name: Verificar correcciones V4
        run: |
          grep -q "function openMaterial" app/src/main/assets/index.html
          grep -q "storage/v1/object/sign/" app/src/main/assets/index.html
          grep -q "versionCode = 3" app/build.gradle.kts

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK V4
        run: gradle :app:assembleDebug --no-daemon

      - name: Verificar APK generado
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ShanRyu-B16.4-B32-V4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
