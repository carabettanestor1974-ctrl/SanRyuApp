name: Construir APK ShanRyu B16.4 B32 V4

on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  compilar-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto V4
        uses: actions/checkout@v4
      - name: Verificar que es el proyecto V4
        run: |
          test -f app/src/main/assets/index.html
          grep -q "INGRESAR COMO PROFESOR" app/src/main/assets/index.html
          grep -q "INGRESAR COMO ADMINISTRADOR" app/src/main/assets/index.html
      - name: Aplicar correcciones puntuales V4
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("app/src/main/assets/index.html")
          s = html.read_text(encoding="utf-8")

          old = """function setupStudentUI(){
 setAdminActionButtons(false);
 const ai=$('authorityAdminIntro'); if(ai) ai.classList.add('hidden');"""
          new = """function setupStudentUI(){
 setAdminActionButtons(false);
 const na=$('newAnnouncementBtn'); if(na) na.classList.add('hidden');
 const ai=$('authorityAdminIntro'); if(ai) ai.classList.add('hidden');"""
          if old not in s:
              raise SystemExit("No se encontró el bloque esperado de setupStudentUI")
          s = s.replace(old, new, 1)

          old = """async function openMaterial(path){if(!path){showModal('Archivo','<div class="empty">El material todavía no tiene un archivo asociado.</div>');return}if(/^https?:\\/\\//i.test(path)){window.open(path,'_blank','noopener');return}const tab=window.open('about:blank','_blank');try{const h={'apikey':CONFIG.key};if(session?.access_token)h.Authorization='Bearer '+session.access_token;const r=await fetch(CONFIG.url+'/storage/v1/object/authenticated/'+CONFIG.materialBucket+'/'+path,{headers:h});if(!r.ok)throw new Error((await r.text())||'No se pudo abrir el PDF.');const blob=await r.blob();const u=URL.createObjectURL(blob);if(tab){tab.location=u;}else{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.click()}setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){if(tab)tab.close();showModal('No se pudo abrir',`<div class="status error">${esc(e.message)}</div>`)}}"""
          new = """async function openMaterial(path){
 if(!path){showModal('Archivo','<div class="empty">El material todavía no tiene un archivo asociado.</div>');return}
 try{
   let target=path;
   if(!/^https?:\\/\\//i.test(path)){
     const signed=await api('/storage/v1/object/sign/'+CONFIG.materialBucket+'/'+path,{method:'POST',body:JSON.stringify({expiresIn:3600})});
     const signedPath=signed?.signedURL||signed?.signedUrl||'';
     if(!signedPath)throw new Error('No se pudo generar el acceso al PDF.');
     target=/^https?:\\/\\//i.test(signedPath)?signedPath:CONFIG.url+signedPath;
   }
   location.href=target;
 }catch(e){
   showModal('No se pudo abrir',`<div class="status error">${esc(e.message)}</div>`);
 }
}"""
          if old not in s:
              raise SystemExit("No se encontró la función esperada openMaterial")
          s = s.replace(old, new, 1)
          html.write_text(s, encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          if 'versionCode = 2' not in g:
              raise SystemExit("No se encontró versionCode = 2")
          gradle.write_text(g.replace('versionCode = 2','versionCode = 3',1), encoding="utf-8")

          main = Path("app/src/main/java/com/shanryu/benitojuarez/MainActivity.kt")
          m = main.read_text(encoding="utf-8")
          old = """            override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean =
                false"""
          new = """            override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                val uri = request.url
                if (uri.scheme == "http" || uri.scheme == "https") {
                    val isAppAsset = uri.host == "appassets.androidplatform.net"
                    if (!isAppAsset) {
                        startActivity(Intent(Intent.ACTION_VIEW, uri))
                        return true
                    }
                }
                return false
            }"""
          if old not in m:
              raise SystemExit("No se encontró shouldOverrideUrlLoading")
          main.write_text(m.replace(old,new,1), encoding="utf-8")
          PY
      - name: Verificar correcciones V4
        run: |
          grep -q "function openBirthCalendar" app/src/main/assets/index.html
          grep -q "function acceptBirthCalendar" app/src/main/assets/index.html
          grep -q 'id="f_photo"' app/src/main/assets/index.html
          grep -q 'id="prof_foto"' app/src/main/assets/index.html
          grep -q "const na=\$('newAnnouncementBtn'\); if(na) na.classList.add('hidden');" app/src/main/assets/index.html
          grep -q "storage/v1/object/sign/' + CONFIG.materialBucket" app/src/main/assets/index.html || grep -q "storage/v1/object/sign/' + CONFIG.materialBucket" app/src/main/assets/index.html
          grep -q "startActivity(Intent(Intent.ACTION_VIEW, uri))" app/src/main/java/com/shanryu/benitojuarez/MainActivity.kt
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK V4
        run: gradle :app:assembleDebug --no-daemon
      - name: Verificar APK generado
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -p "$APK" assets/index.html > /tmp/apk-index.html
          grep -q "function openAnnouncementModal" /tmp/apk-index.html
          grep -q "const na=\$('newAnnouncementBtn'\); if(na) na.classList.add('hidden');" /tmp/apk-index.html
          grep -q "function openMaterial" /tmp/apk-index.html
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ShanRyu-B16.4-B32-V4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
