name: Construir APK ShanRyu

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  compilar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Descomprimir proyecto ShanRyu
        run: |
          mkdir -p shanryu
          ZIP=$(find . -type f -name "*.zip" | head -n 1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP" -d shanryu

      - name: Buscar proyecto Android
        run: |
          echo "Buscando gradlew..."
          find shanryu -name gradlew -type f

      - name: Compilar APK
        run: |
          GRADLEW=$(find shanryu -name gradlew -type f | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ShanRyu-APK
          path: |
            shanryu/**/build/outputs/apk/**/*.apk
