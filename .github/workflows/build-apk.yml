name: Construir APK ShanRyu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  compilar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -o ShanRyu_V13_APK_cloud_ready.zip

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configurar AndroidX y JVM 17
        run: |
          PROJECT_DIR="$(dirname "$(find . -name settings.gradle -print -quit)")"
          echo "Proyecto: $PROJECT_DIR"

          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"

          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$APP_GRADLE"
          sed -i 's/sourceCompatibility JavaVersion.VERSION_1_8/sourceCompatibility JavaVersion.VERSION_17/g' "$APP_GRADLE"
          sed -i 's/targetCompatibility JavaVersion.VERSION_1_8/targetCompatibility JavaVersion.VERSION_17/g' "$APP_GRADLE"

          cat >> "$APP_GRADLE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Verificar Java 17
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Compilar APK
        run: |
          PROJECT_DIR="$(dirname "$(find . -name settings.gradle -print -quit)")"
          echo "Compilando desde: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ShanRyu-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
