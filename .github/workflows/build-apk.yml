name: Construir APK ShanRyu

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  compilar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Buscar proyecto Android
        run: |
          echo "Buscando Gradle..."
          find . -name gradlew -type f

      - name: Compilar APK
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          echo "Gradle encontrado en: $GRADLEW"
          chmod +x "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ShanRyu-APK
          path: |
            **/build/outputs/apk/**/*.apk
